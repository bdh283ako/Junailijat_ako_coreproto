name: secret-scan

# Suojaa remotea: vaikka paikallinen pre-commit-koukku ohitetaan,
# gitleaks skannaa koko historian jokaisella pushilla ja PR:llä.
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # skannaa myös historian, ei vain diffiä
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
